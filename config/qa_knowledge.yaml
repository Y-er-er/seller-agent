# ============================================================
# 客服口径知识库（口径问答入口的标准答案来源）
# ------------------------------------------------------------
# 边界（方案 §12）：本知识库**仅用于解释与释疑**，
#   不参与任何资格判定，也不会改变任何判定结论。
#
# 结构约定：
#   id            条目唯一标识
#   title         条目标题（会展示给使用者，请写业务语言）
#   keywords      命中关键词；**越具体的词请写得越长**（长度参与打分）
#   related_rules 关联规则 ID（可空），用于与命中规则交叉提示
#   answer        标准口径正文（多行文本用 | 折叠，勿写 Markdown 标题）
# ============================================================
version: "2026.10-q1"

entries:
  - id: KB-AMOUNT-GATE
    title: 大额申请为什么转人工（金额闸门）
    keywords: [金额, 大额, 金额闸门, 上限, 300, 转人工, 为什么转人工, 退款金额, 门槛]
    related_rules: [R1]
    answer: |
      申请退款金额**达到**自动处置上限（当前 300 元）时，系统不自动放行，直接转人工复核。
      这是资金风险控制，与订单本身是否合理无关；人工会结合订单、物流与举证情况给出结论。

  - id: KB-SMALL-NOT-SIGNED
    title: 未收到货且金额小，为什么可以自动通过
    keywords: [未签收, 未收到, 没收到, 自动通过, 小额, 小额直通, 未收到货]
    related_rules: [R2]
    answer: |
      物流显示**未签收**、退款原因为**未收到货**，且申请金额不超过小额线（当前 50 元）时，
      系统自动通过。依据是：物流轨迹本身已客观证明货未送达，买家无需额外举证，
      小额自动放行可显著降低人工成本。

  - id: KB-SIGNED-NOT-RECEIVED
    title: 已签收却说没收到，为什么要补证
    keywords: [已签收, 签收, 没收到, 补证, 举证, 48小时, 要求补证]
    related_rules: [R3]
    answer: |
      "已签收却主张未收到货"属于事实争议：物流记录与买家陈述矛盾。
      系统会要求买家补充举证（如包裹照片、监控、开箱视频等），时限 48 小时。
      逾期未补证或补证不充分时，转人工介入判断。

  - id: KB-LOW-RISK-SMALL
    title: 小额且信用良好的买家，为什么自动通过
    keywords: [信用, 信用分, 退款率, 低风险, 自动通过, 650, 15%, 20%]
    related_rules: [R4]
    answer: |
      申请金额不超过小额线（当前 50 元）、买家信用分不低于 650、
      且近 90 天退款率不超过 20% 时，系统自动通过。
      三个条件共同构成"低风险小额"画像，自动放行成本低于人工成本。

  - id: KB-HIGH-FREQUENCY
    title: 为什么高频退款会被转人工
    keywords: [高频, 频繁退款, 退款率, 风险, 90天, 6笔, 次数]
    related_rules: [R5]
    answer: |
      近 90 天退款率达到 20%，或近 90 天仅退款达到 6 笔时，系统将其标记为高风险并转人工。
      这不是直接拒绝，而是交由人工结合历史行为判断是否存在滥用可能。

  - id: KB-EVIDENCE-REQUIRED
    title: 什么情况下会要求补证
    keywords: [补证, 举证, 图片, 照片, 要求举证, 未举证, 无图]
    related_rules: [R6]
    answer: |
      错发/漏发、质量主张等**需要买家提供实物举证**的场景，若有效举证图片为 0，
      系统会要求补证。注意："未收到货"不再计入此类——未签收由物流自证，
      已签收未收到由 R3 专门处理。

  - id: KB-QUALITY-ALWAYS-HUMAN
    title: 质量问题为什么不自动判定（业务红线）
    keywords: [质量, 质量问题, 破损, 坏了, 判定, 为什么转人工, 红线, 人工判定]
    related_rules: [R7]
    answer: |
      **本系统不做质量判定**：任何涉及质量问题的申请一律转人工。
      质量认定需要专业判断与实物核验，自动化判定会带来纠纷与合规风险，
      因此这是不可动摇的业务红线。

  - id: KB-INSUFFICIENT-DATA
    title: 数据不足时为什么会兜底转人工
    keywords: [数据不足, 兜底, 查不到, 取数失败, 转人工, 没有数据]
    related_rules: [R8]
    answer: |
      当订单、物流或买家画像等关键数据取不到时，系统**不猜测、不放行**，
      一律转人工（并标明"数据不足"）。这是"不确行为不动手"原则在判定层的体现。

  - id: KB-EVIDENCE-DEADLINE
    title: 补证时限是多少
    keywords: [时限, 多久, 48小时, 补证时间, 期限, 买卖双方]
    related_rules: [R3, R6]
    answer: |
      补证时限为 48 小时，且对买卖双方对等适用。
      超过时限未补充有效举证，则转人工处理。

  - id: KB-SHADOW-MODE
    title: 影子模式是什么（当前阶段）
    keywords: [影子模式, shadow, 没有退款, 为什么不打款, 只记录, 试运行]
    related_rules: []
    answer: |
      当前系统运行在影子模式：判定链路完整执行、结论与留痕照常产生，
      但**资金动作不会真正落地**（只记录"本应执行什么"）。
      该阶段用于比对人机结论一致率，为放量做准备。

  - id: KB-DISPOSAL-FAILED
    title: 处置未落地为什么会挂起
    keywords: [处置失败, 挂起, 没退成, 重试, 资金动作, 未落地, 执行失败]
    related_rules: []
    answer: |
      若处置（退款）未能成功落地，系统**不会当作成功**，而是升级人工处理，
      并在复核台提供"重试处置"选项。这样可避免出现"以为退了、其实没退"的悬空状态。

  - id: KB-AGREEMENT-RATE
    title: 一致率是什么
    keywords: [一致率, 准确率, 报表, 统计, 复核参与率, 指标]
    related_rules: []
    answer: |
      一致率 = 人工**维持**规则结论的笔数 /（维持 + 改判）笔数，
      即"规则结论被人工认可的比例"，是影子模式调优的核心指标。
      无人工复核样本时该值返回空（null），而不是 0——"没有样本"不等于"完全不一致"。

  - id: KB-REVIEW-ACTIONS
    title: 复核时"维持"和"改判"的区别
    keywords: [维持, 改判, 复核, 怎么复核, 人工决定]
    related_rules: []
    answer: |
      "维持"表示认可系统的判定结论（计入一致率分子）；
      "改判"表示人工给出不同结论（计入分母但不计入分子）。
      两者都会连同复核人一起留痕，用于后续追溯与调优。

  - id: KB-NO-QUALITY-JUDGEMENT
    title: 系统能做与不能做的边界
    keywords: [能做什么, 边界, 权限, 会不会自动判质量, 系统能力, 责任]
    related_rules: []
    answer: |
      系统能做的：受理校验、并行取数、举证核验、**按确定性规则**给出资格结论、
      风险标记、处置执行（受闸门控制）、全程审计留痕。
      系统不做的：质量判定、责任归属认定、绕过规则直接放行或拒绝。
      任何超出规则范围的情形一律转人工。
