<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>商铺经营Agent</title>
<!--
  ============================================================
  商铺经营Agent —— 免构建静态页
  ============================================================
  · 打开方式一：双击本文件（file://）
  · 打开方式二：后端已把 frontend/ 挂到 /ui，访问 http://127.0.0.1:8000/ui/seller.html
  · 入口参数：?api=http://127.0.0.1:8001 可覆盖后端地址（默认 8000）

  三栏结构：
    左＝模块导航（概览 / 商品陈列 / 商品管理 / 售后 / 任务 / 操作日志）
    中＝主内容区（随模块切换）
    右＝**上下文详情面板**（随模块与选中对象变化；概览与售后不显示）

  右下角浮动图标为 AI 助手（浮窗式，可拖动，点击展开）。

  ⚠️ 打开后先弹**登录浮窗**（`.auth#auth`）：页面本身照常加载，不跳转新地址；
     未登录时中栏只显示「请先登录」占位。每次登录后端都分配新的助手线程 → 进来就是新对话。
  ============================================================
-->
<link rel="stylesheet" href="seller.css?v=1021orders5" />
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg></span>商铺经营Agent
  </div>
  <span class="crumb" id="crumb">概览</span>
  <span class="spacer"></span>
  <div class="conn" id="conn"><span class="dot"></span><span id="connText">连接中…</span></div>
  <span class="mode" id="modeChip" title="当前数据源模式（来自 /api/health）"></span>
  <span class="ver" id="verChip" title="前端脚本版本（与 seller.js 内 FRONTEND_VERSION 一致；看不到变化=浏览器用了旧缓存，请 Ctrl+F5）"></span>
  <button id="btnShowRight" hidden>显示详情</button>
  <button id="btnRefresh">刷新</button>
</div>

<div class="stage">
  <aside class="side" id="side"></aside>
  <section class="mid" id="mid"></section>
  <aside class="right" id="right"></aside>
</div>

<div class="fab" id="fab" title="AI 经营助手 · 可拖动，点击展开">
  <span>AI</span><span class="dot" id="fabDot" hidden></span>
</div>

<aside class="drawer" id="drawer">
  <div class="dh">
    <div class="ava">AI</div>
    <div style="min-width:0">
      <b>AI 经营助手</b>
      <div class="ctx" id="aiCtx">—</div>
    </div>
    <div class="spacer"></div>
    <button id="btnCaps" title="我能做什么">?</button>
    <button id="btnNewChat" title="开始新对话">＋</button>
    <button id="btnCloseDrawer" title="关闭">×</button>
  </div>

  <div class="caps" id="caps"></div>
  <div class="chat" id="chat"></div>

  <div class="cin">
    <!-- 上传资料到知识库：卖家在对话里递文件，助手接手入库后就能按原文回答 -->
    <button class="cinAttach" id="btnKbUpload" title="上传资料到知识库（PDF / Word / 文本 / 图片）">
      <svg viewBox="0 0 24 24"><path d="M21 12.5 12.5 21a5 5 0 0 1-7-7l9-9a3.5 3.5 0 1 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg>
    </button>
    <input type="file" id="kbUploadInput" hidden
           accept=".txt,.md,.markdown,.pdf,.docx,.png,.jpg,.jpeg,.webp" />
    <textarea id="chatInput" placeholder="告诉我要做什么…（Ctrl+Enter 发送）" rows="1"></textarea>
    <button class="btn primary" id="btnSend">发送</button>
  </div>
</aside>

<div class="mask" id="mask">
  <div class="dlg">
    <div class="top">
      <div class="ico" id="dlgIco">!</div>
      <div style="min-width:0">
        <h4 id="dlgTitle">确认操作</h4>
        <div class="txt" id="dlgText"></div>
      </div>
    </div>
    <div class="box" id="dlgBox"></div>
    <div class="acts">
      <button class="btn" id="dlgCancel">取消</button>
      <button class="btn danger" id="dlgOk">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ============================================================
     登录浮窗（**浮窗式 · 不跳转新界面**）
     ============================================================
     · 未登录 / 会话过期时，盖在控制台上（页面本身照常加载，不做重定向）
     · 登录成功后原地接管：关闭浮窗 → 拉数据 → 渲染（不刷新页面）
     · 每次登录后端都分配**新的助手会话线程** → 进来就是新对话
     ============================================================ -->
<div class="auth" id="auth" hidden>
  <form class="authbox" id="authForm" autocomplete="on">
    <div class="authhd">
      <span class="logo"><svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg></span>
      <div class="authname">商铺经营Agent<div class="authsub">登录后管理你的店铺</div></div>
    </div>
    <label class="authfield">
      <span>账号</span>
      <input id="authUser" name="username" autocomplete="username" placeholder="请输入账号" spellcheck="false" />
    </label>
    <label class="authfield">
      <span>密码</span>
      <input id="authPass" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
    </label>
    <div class="autherr" id="authErr" hidden></div>
    <button class="btn primary autherbtn" id="authSubmit" type="submit">登录</button>
    <div class="authnote">
      每次登录都会为 AI 助手<b>开启一段新对话</b>。<br />
      初始账号由 <code>backend/.env</code> 的 <code>SELLER_BOOTSTRAP_*</code> 决定。
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<!-- ?v= 与 seller.js 内 FRONTEND_VERSION 同步：改了 JS **或 CSS** 就 bump，防浏览器拿旧缓存
     （CSS 以前没带 ?v=，改了样式刷新看不到变化，只能 Ctrl+F5） -->
<script src="commerce.js?v=1021orders5"></script>
<script src="seller.js?v=1021orders5"></script>
</body>
</html>
