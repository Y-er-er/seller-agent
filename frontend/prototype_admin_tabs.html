<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>原型 · 低库存并入商品管理（子功能栏）</title>
<style>
  :root{
    --side:#0f172a; --side2:#1e293b; --text:#111827; --muted:#6b7280;
    --line:#e5e7eb; --brand:#2563eb; --brand-soft:#eff6ff;
    --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fde68a;
    --danger:#b91c1c; --ok:#15803d;
  }
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
       color:var(--text);background:#f3f5f8;display:flex;min-height:100vh}

  /* ---------- 左栏（只有一层，不再有并列的「低库存」） ---------- */
  .side{width:196px;flex:0 0 196px;background:var(--side);color:#cbd5e1;
        padding:14px 10px;display:flex;flex-direction:column;gap:2px}
  .side .logo{display:flex;align-items:center;gap:8px;padding:6px 8px 14px;color:#fff}
  .side .logo .m{width:24px;height:24px;border-radius:7px;background:var(--brand);
                 display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .grp{font-size:11px;color:#64748b;padding:12px 10px 5px;letter-spacing:.5px}
  .side a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
          color:#cbd5e1;text-decoration:none;font-size:13.5px;cursor:pointer}
  .side a:hover{background:var(--side2)}
  .side a.on{background:var(--brand);color:#fff;font-weight:600}
  .side a .n{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;border-radius:9px;
             padding:0 6px;font-size:11px;min-width:18px;text-align:center}
  .side a.on .n{background:#fff;color:var(--brand)}
  .side a .n.alert{background:#b45309;color:#fff}

  /* ---------- 主区 ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{height:52px;background:#fff;border-bottom:1px solid var(--line);
       display:flex;align-items:center;gap:10px;padding:0 18px}
  .top b{font-size:14px}
  .top .sp{flex:1}

  .body{padding:16px 18px;overflow:auto}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}

  /* ---------- 关键改动：子功能栏（tab） ---------- */
  .tabs{display:flex;align-items:center;gap:4px;padding:0 12px;
        border-bottom:1px solid var(--line);background:#fff}
  .tab{padding:11px 14px;font-size:13px;color:var(--muted);cursor:pointer;
       border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px;
       background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .tab .cnt{background:#f1f5f9;color:#475569;border-radius:9px;padding:0 6px;font-size:11px}
  .tab.on .cnt{background:var(--brand-soft);color:var(--brand)}
  .tab .cnt.warn{background:var(--warn-bg);color:var(--warn)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#f8fafc;color:var(--muted);font-weight:500;font-size:12px;
     text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid #f1f5f9}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafcff}
  .thumb{width:34px;height:34px;border-radius:7px;background:#e2e8f0;display:inline-block;
         vertical-align:middle;margin-right:8px}
  .low{color:var(--danger);font-weight:600}
  .badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11.5px}
  .badge.on{background:#ecfdf5;color:var(--ok);border:1px solid #a7f3d0}
  .badge.draft{background:#f8fafc;color:var(--muted);border:1px solid var(--line)}
  .badge.lowtag{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
  .empty{padding:34px;text-align:center;color:var(--muted)}

  .tip{margin-top:12px;padding:10px 13px;border-radius:9px;background:var(--warn-bg);
       border:1px solid var(--warn-line);color:#7c2d12;font-size:12.5px;display:none}
  .tip.on{display:block}
  .note{margin-top:14px;padding:12px 14px;border-left:3px solid var(--brand);
        background:#fff;border-radius:0 8px 8px 0;font-size:12.5px;color:#334155}
  .note b{color:var(--brand)}
</style>
</head>
<body>

<!-- ================= 左栏：低库存已从一级菜单移除 ================= -->
<aside class="side">
  <div class="logo"><span class="m">卖</span><b>卖家控制台</b></div>

  <div class="grp">总览</div>
  <a data-view="overview">概览</a>

  <div class="grp">经营</div>
  <a data-view="gallery">商品陈列<span class="n">4</span></a>
  <a data-view="admin" class="on">商品管理<span class="n">4</span></a>

  <div class="grp">服务</div>
  <a data-view="aftersale">售后<span class="n">1</span></a>
  <a data-view="audit">操作日志<span class="n">8</span></a>
</aside>

<!-- ================= 主区 ================= -->
<div class="main">
  <div class="top">
    <b>商品管理</b>
    <span class="sp"></span>
    <button class="tab" style="border:1px solid var(--line);border-radius:8px;padding:5px 10px">刷新</button>
  </div>

  <div class="body">
    <div class="panel">
      <!-- ★ 核心：低库存成为「商品管理」下的子功能栏 -->
      <div class="tabs">
        <button class="tab on" data-tab="all">全部商品<span class="cnt">4</span></button>
        <button class="tab" data-tab="low">低库存<span class="cnt warn">1</span></button>
      </div>

      <table>
        <thead>
          <tr><th style="width:34px"><input type="checkbox" /></th><th>商品</th><th>价格</th>
              <th>库存</th><th>状态</th><th>操作</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">没有低于预警阈值的商品 🎉</div>
    </div>

    <div class="tip" id="tip">
      🔔 <b>1 件商品</b>库存已低于预警阈值，建议尽快补货。库存为 0 时买家无法下单。
    </div>

    <div class="note">
      <b>改动说明</b>：左栏原来的「低库存」是**与商品管理并列**的一级项，且它与商品管理用了同一个
      view，导致<b>两个同时高亮</b>、点它也没有真正切换筛选。现在改为商品管理页内的
      <b>子功能栏（tab）</b>：左栏只留「商品管理」一个入口，低库存作为它的一个视图，
      角标 1 也移到 tab 上。顶部工具栏与表格列完全一致，切 tab 只改变筛选范围。
    </div>
  </div>
</div>

<script>
  var GOODS = [
    { no:"G-0001", name:"便携榨汁杯 350ml", price:99.00, stock:3,  alert:10, status:"on_shelf" },
    { no:"G-0002", name:"快充数据线 2 米", price:30.00, stock:46, alert:10, status:"on_shelf" },
    { no:"G-0003", name:"硅胶折叠水壶",     price:29.90, stock:48, alert:10, status:"on_shelf" },
    { no:"G-0004", name:"休闲凉拖鞋",       price:10.00, stock:12, alert:5,  status:"draft" }
  ];

  function isLow(g){ return g.alert > 0 && g.stock <= g.alert; }
  var cur = "all";

  function render(){
    var list = cur === "low" ? GOODS.filter(isLow) : GOODS;
    var tb = document.getElementById("rows");
    tb.innerHTML = list.map(function(g){
      var low = isLow(g);
      return '<tr>'
        + '<td><input type="checkbox" /></td>'
        + '<td><span class="thumb"></span><b>' + g.name + '</b>'
        + ' <span style="color:#94a3b8;font-size:11.5px">' + g.no + '</span>'
        + (low ? ' <span class="badge lowtag">低于预警</span>' : '') + '</td>'
        + '<td>¥' + g.price.toFixed(2) + '</td>'
        + '<td class="' + (low ? "low" : "") + '">' + g.stock
        + '<span style="color:#94a3b8;font-size:11px"> / 预警 ' + g.alert + '</span></td>'
        + '<td><span class="badge ' + (g.status === "on_shelf" ? "on" : "draft") + '">'
        + (g.status === "on_shelf" ? "已上架" : "草稿") + '</span></td>'
        + '<td><a href="javascript:void(0)" style="color:var(--brand)">编辑</a></td>'
        + '</tr>';
    }).join("");
    document.getElementById("empty").style.display = list.length ? "none" : "block";
    document.getElementById("tip").className = "tip" + (cur === "low" ? " on" : "");
  }

  document.querySelectorAll(".tab[data-tab]").forEach(function(btn){
    btn.onclick = function(){
      document.querySelectorAll(".tab[data-tab]").forEach(function(b){ b.classList.remove("on"); });
      btn.classList.add("on");
      cur = btn.getAttribute("data-tab");
      render();
    };
  });

  // 左栏：只有一个「商品管理」入口，点击不再有并列项互斥问题
  document.querySelectorAll(".side a").forEach(function(a){
    a.onclick = function(){
      document.querySelectorAll(".side a").forEach(function(x){ x.classList.remove("on"); });
      a.classList.add("on");
    };
  });

  render();
</script>
</body>
</html>
