<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>售后助手</title>
  <!--
    买家侧对话页（H5）—— Vue 3 + Vite 入口。

    开发：cd frontend && npm run dev  → http://127.0.0.1:5173/h5.html
    构建：cd frontend && npm run build → dist/h5.html
    访问：http://127.0.0.1:8000/ui/dist/h5.html?order_id=DEMO001

    入口参数：?order_id=xxx（也可在页面上手动填写）；?api=http://127.0.0.1:8001 覆盖后端地址。

    **演示模式开关**：开启后任意订单号都按「订单存在」受理——后端按订单号确定性合成
    订单/物流/画像事实（界面显著标注"合成数据"）。
  -->
</head>
<body>
  <a href="consultation.html" class="consult-link">咨询商家（本地演示）</a>
  <div id="h5"></div>
  <noscript>本页需要启用 JavaScript。</noscript>
  <script type="module" src="./src/h5/main.js"></script>
</body>
</html>
